[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brkb-alpha-seeker"
version = "0.1.0"
description = "Research dashboard for BRK.B technical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "streamlit>=1.42",
  "tzdata>=2025.1",
  "vaderSentiment>=3.3.2",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_seeker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
