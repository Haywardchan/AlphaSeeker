services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data
    environment:
      ALPHA_DATA_DIR: /app/data
    restart: unless-stopped

  test:
    build:
      context: .
      target: runtime
    command: pytest
    profiles: ["test"]
